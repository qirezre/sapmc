<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <title>SAP-MC · Absensi &amp; Payroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script>
    /* tema diterapkan SEBELUM render agar tidak berkedip */
    (function(){try{var t=localStorage.getItem('sapmc:theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar-load" id="tl"></div>

  <!-- LOGIN (ditampilkan seketika bila belum ada sesi) -->
  <section id="login" aria-live="polite"></section>

  <!-- APP SHELL -->
  <div id="app">
    <aside class="side" id="side" aria-label="Menu utama"></aside>
    <div class="main">
      <header class="top" id="top"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="bnav" id="bnav" aria-label="Navigasi bawah"></nav>
  </div>

  <!-- Kamera selfie layar penuh -->
  <div id="cam" role="dialog" aria-modal="true" aria-label="Kamera selfie"></div>
  <!-- Modal / Bottom-sheet -->
  <div id="ovl" role="presentation"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pegawai.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/manajemen.js"></script>
  <script>SAP.start();</script>
</body>
</html>
